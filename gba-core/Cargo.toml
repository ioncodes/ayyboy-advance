[package]
name = "gba-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bitflags = "2.6.0"
bitmatch = "0.1.1"
goblin = "0.9.2"
rhai = { version = "1.17.1", features = ["sync"] }
thiserror = "2.0.12"
phf = { version = "0.12.1", features = ["macros"] }
crc32fast = "1.4.2"
tracing = "0.1.41"
btleplug = { version = "0.11.8", optional = true }
tokio = { version = "1.41.1", features = ["rt", "macros"], optional = true }
regex = { version = "1.11.1", optional = true }
uuid = { version = "1.11.0", optional = true }
futures = { version = "0.3.31", optional = true }

[features]
default = []
vibration = ["btleplug", "tokio", "regex", "uuid", "futures"]

[build-dependencies]
csv = "1.3.1"
